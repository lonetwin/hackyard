<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Journal</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@18/lib/marked.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f7f5f2; color: #2c2826; height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: #2c2826; border-bottom: 1px solid #1a1614; padding: 10px 20px;
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    header h1 { font-size: 1rem; color: #f7f5f2; flex: 1; }
    button {
      background: #3d3532; color: #e8e4df; border: 1px solid #5a534e;
      border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 0.8rem;
    }
    button:hover { background: #4a4240; }
    main { display: flex; flex: 1; overflow: hidden; }
    nav {
      width: 270px; min-width: 160px; max-width: 520px; flex-shrink: 0;
      background: #edeae5; border-right: 1px solid #d4cfc8;
      display: flex; flex-direction: column; position: relative;
    }
    #resize-handle {
      position: absolute; right: -4px; top: 0; bottom: 0; width: 8px;
      cursor: col-resize; z-index: 10;
    }
    #resize-handle:hover, #resize-handle.dragging { background: #3d6b9e33; }
    #nav-scroll { flex: 1; overflow-y: auto; padding: 8px 0; }
    /* Expandable day groups */
    details { border-bottom: 1px solid #d4cfc8; }
    details:last-of-type { border-bottom: none; }
    summary.day-label {
      font-size: 0.7rem; font-weight: 700; color: #6b6460; padding: 6px 12px;
      text-transform: uppercase; letter-spacing: 0.07em; cursor: pointer; list-style: none;
      display: flex; align-items: center; gap: 6px; user-select: none;
    }
    summary.day-label::-webkit-details-marker { display: none; }
    summary.day-label::before { content: '▾'; font-size: 0.65rem; color: #9c9590; transition: transform 0.15s; }
    details:not([open]) summary.day-label::before { transform: rotate(-90deg); }
    summary.day-label:hover { background: #e4e0da; color: #2c2826; }
    .session-link {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; white-space: normal;
      padding: 4px 12px 4px 22px; font-size: 0.78rem; color: #5a534e; line-height: 1.4;
      cursor: pointer; border-left: 3px solid transparent;
    }
    .session-link:hover { background: #e0dbd4; color: #2c2826; }
    .session-link.active { background: #ddd7cf; color: #2a5285; border-left-color: #3d6b9e; font-weight: 500; }
    /* Tag cloud */
    #tag-cloud {
      padding: 10px 14px 14px; border-top: 1px solid #d4cfc8;
      display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    }
    #tag-cloud-label {
      font-size: 0.62rem; font-weight: 700; color: #9c9590; text-transform: uppercase;
      letter-spacing: 0.07em; width: 100%; margin-bottom: 2px;
      display: flex; align-items: center; justify-content: space-between;
    }
    #tag-clear {
      font-size: 0.62rem; font-weight: 600; color: #3d6b9e; cursor: pointer;
      text-transform: none; letter-spacing: 0; display: none;
    }
    #tag-clear:hover { text-decoration: underline; }
    .tag-word {
      color: #4a7fa8; cursor: pointer; line-height: 1.3;
      padding: 2px 6px; border-radius: 10px; transition: background 0.12s, color 0.12s;
    }
    .tag-word:hover { background: #d4e4f0; }
    .tag-word.active { background: #3d6b9e; color: #fff; }
    .session-link.filtered-out { display: none; }
    /* Main content */
    article { flex: 1; overflow-y: auto; padding: 0; }
    .page-body { display: flex; gap: 0; min-height: 100%; }
    .content-area { flex: 1; min-width: 0; padding: 24px 32px 40px 40px; }
    .meta-sidebar {
      width: 168px; flex-shrink: 0; padding: 24px 20px 24px 0;
      position: sticky; top: 0; max-height: 100vh; overflow-y: auto;
    }
    .meta-group { margin-bottom: 14px; }
    .meta-group-label {
      font-size: 0.6rem; font-weight: 700; color: #9c9590; text-transform: uppercase;
      letter-spacing: 0.07em; margin-bottom: 5px;
    }
    .meta-group .badge { display: block; margin-bottom: 4px; word-break: break-word; }
    .badge { font-size: 0.72rem; padding: 2px 9px; border-radius: 12px; text-decoration: none; }
    #welcome {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 12px; color: #9c9590;
    }
    #welcome h2 { color: #2c2826; font-size: 1.2rem; }
    #welcome p { font-size: 0.85rem; }
    .badge-model  { background: #e8f0fb; color: #2a5285; border: 1px solid #a8c4e8; }
    .badge-repo   { background: #f0ede8; color: #6b6460; border: 1px solid #c8c0b8; }
    .badge-tag    { background: #e8f5ec; color: #2d6a3f; border: 1px solid #a0cca8; }
    .badge-pr     { background: #f0e8f8; color: #5a2d82; border: 1px solid #c0a0d8; }
    .badge-commit { background: #f0ede8; color: #6b6460; border: 1px solid #c8c0b8; }
    .badge-issue  { background: #fde8e8; color: #8b2020; border: 1px solid #e0a0a0; }
    .content h1 { font-size: 1.6rem; color: #1a1614; margin: 0 0 14px; border-bottom: 1px solid #d4cfc8; padding-bottom: 10px; font-weight: 700; }
    .content h2 { font-size: 1.15rem; color: #2c2826; margin: 26px 0 10px; font-weight: 600; }
    .content h3 { font-size: 1rem;    color: #3d3532; margin: 20px 0 8px; font-weight: 600; }
    .content p  { line-height: 1.75; margin: 0 0 12px; color: #2c2826; }
    .content ul, .content ol { padding-left: 1.5em; margin: 0 0 12px; }
    .content li { line-height: 1.65; margin-bottom: 4px; }
    .content a  { color: #3d6b9e; text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    .content code {
      background: #ece8e2; padding: 2px 5px; border-radius: 3px;
      font-size: 0.85em; font-family: 'SFMono-Regular', Consolas, monospace; color: #2c2826;
    }
    .content pre {
      background: #f0ede8; border: 1px solid #d4cfc8; border-radius: 6px;
      padding: 14px; overflow-x: auto; margin: 0 0 14px;
    }
    .content pre code { background: none; padding: 0; }
    .content table { border-collapse: collapse; width: 100%; margin: 0 0 14px; }
    .content th, .content td { border: 1px solid #d4cfc8; padding: 7px 11px; text-align: left; }
    .content th { background: #edeae5; color: #2c2826; font-weight: 600; }
    .content blockquote { border-left: 3px solid #c8c0b8; padding-left: 14px; color: #6b6460; margin: 0 0 14px; }
    .content hr { border: none; border-top: 1px solid #d4cfc8; margin: 22px 0; }
    #nav-placeholder { padding: 14px; color: #9c9590; font-size: 0.78rem; }
  </style>
</head>
<body>
  <header>
    <h1>📓 Dev Journal</h1>
    <button id="btn-open">Open Journal Folder</button>
    <button id="btn-back" style="display:none">← Back</button>
  </header>
  <main>
    <nav id="nav">
      <div id="resize-handle"></div>
      <div id="nav-scroll">
        <div id="nav-placeholder">Open a folder to begin</div>
      </div>
      <div id="tag-cloud" style="display:none">
        <div id="tag-cloud-label">Tags <span id="tag-clear">✕ clear</span></div>
      </div>
    </nav>
    <article id="content">
      <div id="welcome">
        <h2>📓 Dev Journal</h2>
        <p>Click <strong>Open Journal Folder</strong> to get started.</p>
        <p style="font-size:0.75rem;color:#9c9590">HTTP mode: journal loads automatically. For <code>file://</code> access, open via Chrome/Edge or use <code>python3 -m http.server</code>.</p>
      </div>
    </article>
  </main>

  <script>
    'use strict';

    let dirHandle = null;   // File System Access API handle OR fallback object
    let navHistory = [];    // stack of { path, linkEl }
    let _markedReady = false;

    // ── File System Access ──────────────────────────────────────────────────

    // When served over HTTP the files are already accessible via fetch() —
    // no picker needed.  File picker is only used for file:// protocol.
    const _httpMode = ['http:', 'https:'].includes(window.location.protocol);

    // Firefox's showDirectoryPicker uses the sandboxed Origin Private File System,
    // not real disk files — force the webkitdirectory fallback for Firefox.
    const _useNativePicker = !_httpMode
                             && !navigator.userAgent.includes('Firefox')
                             && 'showDirectoryPicker' in window;

    async function openFolder() {
      if (_useNativePicker) {
        try {
          dirHandle = await window.showDirectoryPicker({ mode: 'read' });
        } catch (e) {
          if (e.name !== 'AbortError') console.error(e);
          return;
        }
        await buildNav({ autoOpen: true });
      }
    }

    function openFolderFallback() {
      const input = document.createElement('input');
      input.type = 'file';
      input.webkitdirectory = true;
      input.multiple = true;
      input.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
      // Must be in DOM before .click() for Firefox to honour it
      document.body.appendChild(input);
      input.onchange = async () => {
        document.body.removeChild(input);
        const files = Array.from(input.files);
        if (!files.length) return;
        dirHandle = { _fallback: true, _files: files };
        await buildNav({ autoOpen: true });
      };
      input.click();
    }

    async function readFile(path) {
      if (_httpMode) {
        const resp = await fetch('/' + path);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${path}`);
        return resp.text();
      }
      if (dirHandle._fallback) {
        const file = dirHandle._files.find(f => {
          const rel = f.webkitRelativePath.replace(/^[^/]+\//, '');
          return rel === path;
        });
        if (!file) throw new Error(`File not found: ${path}`);
        return file.text();
      }
      const parts = path.split('/');
      let handle = dirHandle;
      for (let i = 0; i < parts.length - 1; i++) {
        handle = await handle.getDirectoryHandle(parts[i]);
      }
      const fh = await handle.getFileHandle(parts[parts.length - 1]);
      const f = await fh.getFile();
      return f.text();
    }

    async function listDayDirs() {
      if (_httpMode) {
        const resp = await fetch('/');
        const html = await resp.text();
        const matches = [...html.matchAll(/href="(\d{4}-\d{2}-\d{2})\/?"/g)];
        return matches.map(m => m[1]).sort().reverse();
      }
      if (dirHandle._fallback) {
        const days = new Set();
        for (const f of dirHandle._files) {
          const rel = f.webkitRelativePath.replace(/^[^/]+\//, '');
          const parts = rel.split('/');
          if (parts.length >= 2 && /^\d{4}-\d{2}-\d{2}$/.test(parts[0])) {
            days.add(parts[0]);
          }
        }
        return [...days].sort().reverse();
      }
      const days = [];
      for await (const [name, handle] of dirHandle.entries()) {
        if (handle.kind === 'directory' && /^\d{4}-\d{2}-\d{2}$/.test(name)) {
          days.push(name);
        }
      }
      return days.sort().reverse();
    }

    // ── YAML frontmatter parser ─────────────────────────────────────────────
    // Handles: scalar key: value, arrays (key:, then - item or - key: val), nested mappings.

    function parseFrontmatter(text) {
      const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
      if (!m) return { meta: {}, body: text };
      return { meta: parseSimpleYaml(m[1]), body: text.slice(m[0].length).trim() };
    }

    function stripQuotes(s) {
      return s.replace(/^["'](.*)["']$/, '$1');
    }

    function parseSimpleYaml(yaml) {
      const result = {};
      let currentListKey = null;
      let currentItem = null;

      for (const rawLine of yaml.split('\n')) {
        const line = rawLine.replace(/\r$/, '');
        const indent = line.match(/^(\s*)/)[1].length;
        const t = line.trim();
        if (!t || t.startsWith('#')) continue;

        if (indent === 0) {
          currentItem = null;
          if (t.endsWith(':')) {
            currentListKey = t.slice(0, -1);
            result[currentListKey] = [];
          } else {
            const ci = t.indexOf(':');
            if (ci > 0) {
              currentListKey = null;
              result[t.slice(0, ci).trim()] = stripQuotes(t.slice(ci + 1).trim());
            }
          }
        } else if (indent === 2 && currentListKey !== null) {
          if (t.startsWith('- ')) {
            const rest = t.slice(2);
            const ci = rest.indexOf(':');
            if (ci > 0) {
              currentItem = {};
              result[currentListKey].push(currentItem);
              currentItem[rest.slice(0, ci).trim()] = stripQuotes(rest.slice(ci + 1).trim());
            } else {
              result[currentListKey].push(stripQuotes(rest));
              currentItem = null;
            }
          }
        } else if (indent === 4 && currentItem !== null) {
          const ci = t.indexOf(':');
          if (ci > 0) {
            currentItem[t.slice(0, ci).trim()] = stripQuotes(t.slice(ci + 1).trim());
          }
        }
      }
      return result;
    }

    // ── Navigation ──────────────────────────────────────────────────────────

    async function buildNav({ autoOpen = false } = {}) {
      const days = await listDayDirs();
      const navScroll = document.getElementById('nav-scroll');
      navScroll.innerHTML = '';

      const tagCounts = {};  // tag → frequency across all sessions
      let firstLink = null;  // for auto-open on initial load

      for (const day of days) {
        let sessions = [];
        try {
          const text = await readFile(`${day}/index.md`);
          const { meta } = parseFrontmatter(text);
          sessions = Array.isArray(meta.sessions) ? meta.sessions : [];
          sessions.sort((a, b) => (b.time || '').localeCompare(a.time || ''));
        } catch {
          continue; // no index.md — skip day
        }
        if (!sessions.length) continue;

        const details = document.createElement('details');
        details.open = navScroll.children.length === 0;  // only first (latest) day open

        const summary = document.createElement('summary');
        summary.className = 'day-label';
        summary.textContent = formatDay(day);
        details.appendChild(summary);

        for (const s of sessions) {
          const el = document.createElement('div');
          el.className = 'session-link';
          el.textContent = s.title || s.file || s.id;
          el.dataset.path = `${day}/${s.file}`;
          el.onclick = () => navigate(`${day}/${s.file}`, el);
          details.appendChild(el);

          // Track the very first link (latest session — days are newest-first)
          if (!firstLink) firstLink = { path: `${day}/${s.file}`, el };

          // Collect tags from each session file asynchronously
          if (s.file) {
            const linkEl = el;  // capture for closure
            readFile(`${day}/${s.file}`).then(text => {
              const { meta } = parseFrontmatter(text);
              const tags = Array.isArray(meta.tags) ? meta.tags.map(t => t.trim()).filter(Boolean) : [];
              linkEl.dataset.tags = JSON.stringify(tags);  // for filtering
              tags.forEach(tag => {
                tagCounts[tag] = (tagCounts[tag] || 0) + 1;
              });
              renderTagCloud(tagCounts);
            }).catch(() => {});
          }
        }

        navScroll.appendChild(details);
      }

      if (!navScroll.children.length) {
        navScroll.innerHTML = '<div id="nav-placeholder">No journal entries found</div>';
        return;
      }

      if (autoOpen && firstLink) {
        navigate(firstLink.path, firstLink.el);
      }
    }

    function renderTagCloud(tagCounts) {
      const cloud = document.getElementById('tag-cloud');
      const entries = Object.entries(tagCounts);
      if (!entries.length) { cloud.style.display = 'none'; return; }

      const counts = entries.map(([, c]) => c);
      const minCount = Math.min(...counts);
      const maxCount = Math.max(...counts);
      const minSize = 0.7;
      const maxSize = 1.15;

      // Remove old tag words (keep the label div)
      Array.from(cloud.querySelectorAll('.tag-word')).forEach(el => el.remove());

      entries.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      entries.forEach(([tag, count]) => {
        const size = maxCount === minCount
          ? (minSize + maxSize) / 2
          : minSize + (count - minCount) / (maxCount - minCount) * (maxSize - minSize);
        const span = document.createElement('span');
        span.className = 'tag-word';
        span.textContent = tag;
        span.style.fontSize = size.toFixed(2) + 'rem';
        span.title = `${count} session${count > 1 ? 's' : ''} — click to filter`;
        span.dataset.tag = tag;
        if (activeTags.has(tag)) span.classList.add('active');
        span.onclick = () => toggleTagFilter(tag);
        cloud.appendChild(span);
      });

      cloud.style.display = '';
    }

    const activeTags = new Set();

    function toggleTagFilter(tag) {
      if (activeTags.has(tag)) {
        activeTags.delete(tag);
      } else {
        activeTags.add(tag);
      }
      applyFilter();
    }

    function applyFilter() {
      // Update tag cloud active states
      document.querySelectorAll('.tag-word').forEach(span => {
        span.classList.toggle('active', activeTags.has(span.dataset.tag));
      });

      // Show/hide the clear button
      document.getElementById('tag-clear').style.display = activeTags.size ? 'inline' : 'none';

      const links = document.querySelectorAll('.session-link');
      if (!activeTags.size) {
        // No filter — show everything, restore default collapse state
        links.forEach(el => el.classList.remove('filtered-out'));
        document.querySelectorAll('#nav-scroll details').forEach((details, i) => {
          details.open = i === 0;
        });
      } else {
        links.forEach(el => {
          const tags = JSON.parse(el.dataset.tags || '[]');
          const matches = tags.some(t => activeTags.has(t));
          el.classList.toggle('filtered-out', !matches);
        });
        // Auto-collapse/expand groups based on whether they have visible sessions
        document.querySelectorAll('#nav-scroll details').forEach(details => {
          const hasVisible = [...details.querySelectorAll('.session-link')]
            .some(el => !el.classList.contains('filtered-out'));
          details.open = hasVisible;
        });
      }
    }

    function navigate(path, linkEl) {
      document.querySelectorAll('.session-link').forEach(e => e.classList.remove('active'));
      if (linkEl) linkEl.classList.add('active');
      navHistory.push({ path, linkEl });
      document.getElementById('btn-back').style.display = navHistory.length > 1 ? '' : 'none';
      loadAndRender(path);
    }

    async function loadAndRender(path) {
      const content = document.getElementById('content');
      try {
        const text = await readFile(path);
        const currentDir = path.split('/').slice(0, -1).join('/');
        renderContent(text, currentDir);
      } catch (e) {
        content.innerHTML = `<div style="padding:32px;color:#8b2020">Error: ${esc(e.message)}</div>`;
      }
    }

    // ── Rendering ───────────────────────────────────────────────────────────

    function renderContent(text, currentDir) {
      const { meta, body } = parseFrontmatter(text);
      const content = document.getElementById('content');

      if (typeof marked === 'undefined') {
        content.innerHTML = '<div style="padding:32px;color:#8b2020">Error: marked.js could not be loaded from CDN. Check your internet connection and reload the page.</div>';
        return;
      }
      if (!_markedReady) {
        try { marked.use({ renderer: { html: ({ text: t }) => esc(t) } }); } catch (_) {}
        _markedReady = true;
      }

      let sidebar = '<aside class="meta-sidebar">';
      if (meta.model) {
        sidebar += `<div class="meta-group"><div class="meta-group-label">Model</div><span class="badge badge-model">🤖 ${esc(meta.model)}</span></div>`;
      }
      if (meta.repository) {
        const repo = `<span class="badge badge-repo">📁 ${esc(meta.repository)}</span>`;
        const branch = meta.branch ? `<span class="badge badge-repo">🌿 ${esc(meta.branch)}</span>` : '';
        sidebar += `<div class="meta-group"><div class="meta-group-label">Repo</div>${repo}${branch}</div>`;
      }
      if (Array.isArray(meta.tags) && meta.tags.length) {
        sidebar += '<div class="meta-group"><div class="meta-group-label">Tags</div>';
        meta.tags.forEach(t => { sidebar += `<span class="badge badge-tag">#${esc(t)}</span>`; });
        sidebar += '</div>';
      }
      if (Array.isArray(meta.refs) && meta.refs.length) {
        sidebar += '<div class="meta-group"><div class="meta-group-label">Links</div>';
        meta.refs.forEach(r => {
          const cls   = r.type === 'pr' ? 'badge-pr' : r.type === 'issue' ? 'badge-issue' : 'badge-commit';
          const icon  = r.type === 'pr' ? '⬆' : r.type === 'issue' ? '🐛' : '📌';
          const label = r.title || (r.sha ? r.sha.slice(0, 7) : r.url || r.type);
          const rawUrl = r.url || '';
          const safeUrl = /^https?:\/\//i.test(rawUrl) ? rawUrl : '#';
          sidebar += `<a href="${esc(safeUrl)}" class="badge ${cls}" target="_blank" rel="noopener noreferrer">${icon} ${esc(label)}</a>`;
        });
        sidebar += '</div>';
      }
      sidebar += '</aside>';

      const html = marked.parse(body);
      content.innerHTML = `<div class="page-body"><div class="content-area"><div class="content">${html}</div></div>${sidebar}</div>`;

      // Post-process links: internal .md → in-viewer; external → new tab
      content.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href');
        if (!href) return;
        if (href.endsWith('.md') && !href.startsWith('http')) {
          const target = currentDir ? `${currentDir}/${href}` : href;
          a.removeAttribute('href');
          a.style.cursor = 'pointer';
          a.onclick = e => { e.preventDefault(); navigate(target, null); };
        } else if (/^https?:\/\//i.test(href)) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        } else {
          a.removeAttribute('href');
        }
      });
    }

    // ── Helpers ─────────────────────────────────────────────────────────────

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
      }

    function formatDay(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-GB', {
        weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
      });
    }

    // ── Nav resize handle ────────────────────────────────────────────────────

    (function () {
      const handle = document.getElementById('resize-handle');
      const nav = document.getElementById('nav');
      let startX, startW;
      handle.addEventListener('mousedown', e => {
        startX = e.clientX;
        startW = nav.offsetWidth;
        handle.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });
      document.addEventListener('mousemove', e => {
        if (!handle.classList.contains('dragging')) return;
        const w = Math.min(520, Math.max(160, startW + e.clientX - startX));
        nav.style.width = w + 'px';
      });
      document.addEventListener('mouseup', () => {
        handle.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      });
    })();

    // ── Event wiring ────────────────────────────────────────────────────────

    document.getElementById('btn-open').onclick = openFolder;

    document.getElementById('btn-back').onclick = () => {
      navHistory.pop(); // remove current entry
      const prev = navHistory.pop(); // remove previous (navigate() will re-push it)
      if (prev) navigate(prev.path, prev.linkEl);
      else document.getElementById('btn-back').style.display = 'none';
    };

    document.getElementById('tag-clear').onclick = () => {
      activeTags.clear();
      applyFilter();
    };

    // HTTP mode: files are accessible via fetch() — auto-load immediately,
    // no folder picker needed.
    if (_httpMode) {
      const btn = document.getElementById('btn-open');
      btn.textContent = '↺ Refresh';
      btn.onclick = () => buildNav();        // Refresh: no auto-open
      buildNav({ autoOpen: true });           // Initial load: open latest
    }
  </script>
</body>
</html>
